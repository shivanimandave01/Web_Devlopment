<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>to-do list</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
        }
        h1 {
            color: #333;
        }
        ul {
            list-style-type: none;
            padding: 0;
        }
        li {
            padding: 10px;
            border-bottom: 1px solid #ccc;
        }
        button {
            margin-left: 10px;
        }
    </style>
</head>
<body>
    <h1>To-Do List</h1>
    <ul>
        <li>Task 1<button onclick="removeTask(this)">Remove</button></li>
        <li>Task 2<button onclick="removeTask(this)">Remove</button></li>
        <li>Task 3<button onclick="removeTask(this)">Remove</button></li>

    </ul>
    <input type="text" id="newTask" placeholder="Enter a new task">
    <button id="addButton">Add Task</button>

    <script src="code.js"></script>
</body>
</html>
