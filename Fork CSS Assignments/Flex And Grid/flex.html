<!DOCTYPE html>
<html lang="en">
<head>
    <title>Document</title>
    <style>
        .container{
            background-color: aqua;
            display: flex;
            align-items: center;
            
        }
        .item{
            background-color: bisque;
            border: 1px solid black;
            width: 25%;
            height: 150px;
            margin:1px;
            flex-wrap:wrap;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="item">1</div>
        <div class="item">2</div>
        <div class="item">3</div>
        <div class="item">4</div>
    </div>
</body>
</html>
