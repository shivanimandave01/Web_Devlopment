<!DOCTYPE html>
<html lang="en">
<head>
    <title>Document</title>
    <style>
        li:first-child{
            color: aquamarine;
        }
        li:nth-child(even){
            color: blueviolet;
        }
        li:nth-child(5){
            color: cadetblue;
        }
    </style>
</head>
<body>
    <h4>Vegetables list</h4>
    <ol>
        <li>Potato</li>
        <li>Tomato</li>
        <li>Carrot</li>
        <li>spinach</li>
        <li>beetroot</li>
    </ol>
</body>
</html>
