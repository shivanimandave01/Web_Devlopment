<!DOCTYPE html>
<html lang="en">
<head>
    <title>Register Member</title>
</head>
<body>
    <h1>Register New Member</h1>
    <form>
        Full Name:<input type="text"><br><br>
        Email:<input type="email"><br><br>
        Mobile No:<input type="Number"><br><br>
    
        <label for="gender">Gender</label>
        <select type="checkbox">
        <option value="Male">Male</option>
        <option value="female">Female</option>
        <option value="Other">Other</option>
    </select>
     <br><br>
     
     <label for="Address">Address</label>
     <textarea value="Address" cols="20" row="4"></textarea><br><br>
    
     <label for="Designation">Designation</lable>
     <select type="downlist">
        <option value="principle">1.principle</option>
        <option value="Teacher">2.Teacher</option>
        <option value="Staff">3. Staff</option>
     </select><br><br>

    <label for="Department">Department</label>
    <select type="Downlist">
        <option value="Arts">Arts</option>
        <option value="Commerce">Commerce</option>
        <option value="Science">Science</option>
        <option value="Account">Account</option>
    </select><br><br>
    <button>Submit</button><br><br>
    <button>Reset</button>
    </form>
</body>
</html>
