<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="./bootstrap-5.3.8-dist/css/bootstrap.min.css">
</head>
<body>
    <form action="" class="container mt-3">
        <div class="mb-3">
            <label class="form-label">Name</label>
        <input type="text" class="form-controls" placeholder="Enter Your Name">
        </div>
        <div class="mb-3">
            <label class="form-label">Email</label>
        <input type="email" class="form-controls" placeholder="Enter Your Email">
        </div>
        <div class="mb-3">
            <label class="form-label">Password</label>
        <input type="password" class="form-controls" placeholder="Enter Password">
        </div>
        <div class="mb-3">
            <button class="btn btn-primary form">Save</button>
            <script src="./bootstrap-5.3.8-dist/js/bootstrap.min.js"></script>
        </div>
    </form>
</body>
</html>
