<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Display</title>
    <link rel="stylesheet" href="bootstrap-5.3.8-dist/css/bootstrap.min.css">
</head>
<body>
    <div class="container">
        <div class="d-block">
            <div class="bg-info">1</div>
            <div class="bg-secondary">2</div>
        </div>
        </div>
        <div class="d-inline container-fluid">
            <div class="bg-primary">1</div>
            <div class="bg-success">2</div>
            <div class="bg-danger">3</div>
    </div>
     <div class="d-flex container" style="height: 80px;width: 100vw;">
            <div class="bg-primary" style="width: 32%;">1</div>
            <div class="bg-success" style="width: 32%;">2</div>
            <div class="bg-danger" style="width: 32%;">3</div>
    </div>
</body>
</html>
